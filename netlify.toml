# Static site: nothing to build, publish the repository root.
# These settings override the build settings in the Netlify UI.
[build]
  base = ""
  publish = "."
  command = "echo 'Static site, nothing to build'"

[build.environment]
  # Not a Next.js app: skip the auto-installed Next.js runtime plugin.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
